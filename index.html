<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Nativo - Foz do Iguazú</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        h2 { color: #00ffcc; margin-bottom: 5px; font-size: 18px; }
        .container {
            max-width: 450px;
            margin: auto;
            background: #161616;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 4px 25px rgba(0,255,204,0.15);
        }
        .target-box {
            margin-bottom: 12px;
            padding: 8px;
            background: #222;
            border-radius: 8px;
            border: 1px dashed #00ffcc;
            font-size: 11px;
            color: #aaa;
        }
        .view-container {
            position: relative;
            width: 100%;
            height: 320px;
            margin: 10px auto;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #00ffcc;
            background: #000;
        }
        video.cam-stream, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* VIDEO AR FLOTANDO DIRECTAMENTE SOBRE LA CÁMARA */
        #activeVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 10;
        }
        /* BOTÓN MINIMALISTA DE RE-ESCANEO */
        .reset-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 77, 77, 0.9);
            color: #fff;
            border: none;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            z-index: 15;
            display: none;
        }
        .reset-btn:hover { background-color: #e60000; }

        #status {
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AR Nativo - Foz do Iguazú</h2>
    
    <div class="target-box">
        Apunta la cámara al póster. Asegúrate de tener <b>video5.mp4</b> en la misma carpeta.
    </div>

    <div class="view-container">
        <!-- Cámara en vivo de fondo -->
        <video id="videoCam" class="cam-stream" autoplay playsinline></video>
        <!-- Canvas oculto para procesamiento matemático -->
        <canvas id="processingCanvas" style="display:none;"></canvas>

        <!-- Video que aparece directamente sobre la cámara al detectar -->
        <video id="activeVideo" loop muted playsinline src="video5.mp4"></video>
        
        <!-- Botón para salir/reiniciar -->
        <button id="resetBtn" class="reset-btn" onclick="reiniciarEscaneo()">✖ Re-escanear</button>
    </div>

    <div id="status" style="color: #ffaa00;">⏳ Buscando huella espectral de la imagen...</div>
</div>

<script>
    const videoCam = document.getElementById('videoCam');
    const processingCanvas = document.getElementById('processingCanvas');
    const activeVideo = document.getElementById('activeVideo');
    const resetBtn = document.getElementById('resetBtn');
    const statusDiv = document.getElementById('status');

    let scanInterval;
    let hudBloqueado = false;

    async function iniciarCamara() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            videoCam.srcObject = stream;
            videoCam.onloadedmetadata = () => {
                processingCanvas.width = videoCam.videoWidth;
                processingCanvas.height = videoCam.videoHeight;
                iniciarBucleEscaneo();
            };
        } catch (err) {
            alert("Error al acceder a la cámara: " + err);
        }
    }

    iniciarCamara();

    function iniciarBucleEscaneo() {
        if (scanInterval) clearInterval(scanInterval);
        scanInterval = setInterval(analizarHuellaEspectralCamara, 200);
    }

    function analizarHuellaEspectralCamara() {
        if (hudBloqueado) return;

        const ctx = processingCanvas.getContext('2d');
        const w = processingCanvas.width;
        const h = processingCanvas.height;

        ctx.drawImage(videoCam, 0, 0, w, h);
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        const gridSize = 6;
        const blockSizeX = w / gridSize;
        const blockSizeY = h / gridSize;

        let verdeAbundante = 0; 
        let contrasteCentral = 0; 
        let azulBandera = 0; 

        for (let row = 0; row < gridSize; row++) {
            for (let col = 0; col < gridSize; col++) {
                let rSum = 0, gSum = 0, bSum = 0, count = 0;
                
                for (let y = row * blockSizeY; y < (row + 1) * blockSizeY; y += 10) {
                    for (let x = col * blockSizeX; x < (col + 1) * blockSizeX; x += 10) {
                        let idx = (Math.floor(y) * w + Math.floor(x)) * 4;
                        rSum += data[idx];
                        gSum += data[idx+1];
                        bSum += data[idx+2];
                        count++;
                    }
                }

                let avgR = rSum / count;
                let avgG = gSum / count;
                let avgB = bSum / count;

                if (row < 4 && avgG > avgR && avgG > avgB && avgG > 70) {
                    verdeAbundante++;
                }

                if (Math.abs(avgR - avgG) > 30 || Math.abs(avgG - avgB) > 30) {
                    contrasteCentral++;
                }

                if (row >= 4 && col >= 4 && avgB > avgR && avgB > 90) {
                    azulBandera++;
                }
            }
        }

        let esImagenReconocida = (verdeAbundante >= 4 && contrasteCentral >= 10 && azulBandera >= 1);

        if (esImagenReconocida) {
            hudBloqueado = true;
            clearInterval(scanInterval);

            // Mostramos únicamente el video flotando sobre la cámara y el botón de reinicio
            activeVideo.style.display = "block";
            resetBtn.style.display = "block";
            statusDiv.style.color = "#00ffcc";
            statusDiv.innerText = "✔ ¡Imagen Reconocida! Video en pantalla";
            
            activeVideo.play().catch(e => console.log("Autoplay prevenido:", e));
        }
    }

    function reiniciarEscaneo() {
        hudBloqueado = false;
        activeVideo.pause();
        activeVideo.currentTime = 0;
        activeVideo.style.display = "none";
        resetBtn.style.display = "none";
        statusDiv.style.color = "#ffaa00";
        statusDiv.innerText = "⏳ Buscando huella espectral de la imagen...";
        iniciarBucleEscaneo();
    }
</script>

</body>
</html>
